[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egonets-wl-kernel"
version = "0.1.0"
description = "Research scaffolding for WL graph kernels on EGONETS"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "networkx>=3.2", "scikit-learn>=1.4", "numpy>=1.26"]
graphs = ["networkx>=3.2", "scikit-learn>=1.4", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
